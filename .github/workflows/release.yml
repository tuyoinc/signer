name: Release

# Push a tag like v0.1.0 (or v0.2.0-rc.1 for a prerelease) on main.
#
# macOS builds are signed with Developer ID and notarized when the
# `macos-signing` environment has the Apple secrets; otherwise they are
# ad-hoc signed. Update manifests are signed when UPDATE_SIGNING_KEY is set.
# See RELEASING.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Compiled into the binary; it only installs updates signed by this key.
  TUYO_SIGNER_UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}

jobs:
  verify:
    name: Check tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [[ "${version}" != "${crate}" ]]; then
            echo "Tag ${tag} does not match Cargo.toml version ${crate}." >&2
            exit 1
          fi
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || {
            echo "Release tags must point at a commit on main." >&2
            exit 1
          }
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          [[ "${version}" == *-* ]] && pre=true || pre=false
          echo "prerelease=${pre}" >> "${GITHUB_OUTPUT}"

  linux:
    name: Build ${{ matrix.target }}
    needs: verify
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/tuyo-signer dist/tuyo-signer-${{ matrix.target }}
          dist/tuyo-signer-${{ matrix.target }} --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/tuyo-signer-${{ matrix.target }}
          archive: false
          if-no-files-found: error

  windows:
    name: Build x86_64-pc-windows-msvc
    needs: verify
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - shell: bash
        run: |
          mkdir dist
          cp target/x86_64-pc-windows-msvc/release/tuyo-signer.exe dist/tuyo-signer-x86_64-pc-windows-msvc.exe
          dist/tuyo-signer-x86_64-pc-windows-msvc.exe --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/tuyo-signer-x86_64-pc-windows-msvc.exe
          archive: false
          if-no-files-found: error

  macos:
    name: Build universal macOS binary
    needs: verify
    runs-on: macos-15
    timeout-minutes: 45
    environment:
      name: macos-signing
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_NOTARY_APPLE_ID: ${{ vars.APPLE_NOTARY_APPLE_ID }}
      HAS_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Install signing credentials
        if: env.HAS_CERTIFICATE == 'true'
        env:
          MACOS_SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_P12_BASE64 }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ ! "${APPLE_TEAM_ID}" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "Set the APPLE_TEAM_ID variable to the 10-character Team ID." >&2
            exit 1
          fi
          certificate="${RUNNER_TEMP}/developer-id.p12"
          keychain="${RUNNER_TEMP}/signing.keychain-db"
          password="$(openssl rand -hex 32)"
          printf '%s' "${MACOS_SIGNING_CERTIFICATE_P12_BASE64}" | /usr/bin/base64 -D -o "${certificate}"
          security create-keychain -p "${password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${password}" "${keychain}"
          security import "${certificate}" -P "${MACOS_SIGNING_CERTIFICATE_PASSWORD}" \
            -A -t cert -f pkcs12 -k "${keychain}"
          security set-key-partition-list -S apple-tool:,apple: -s -k "${password}" "${keychain}"
          security list-keychains -d user -s "${keychain}"
          identity="$(security find-identity -v -p codesigning "${keychain}" |
            sed -n "s/^ *[0-9]*) \([0-9A-F]\{40\}\) \"Developer ID Application: .*(${APPLE_TEAM_ID})\"$/\1/p" | head -1)"
          if [[ -z "${identity}" ]]; then
            echo "No Developer ID Application identity for team ${APPLE_TEAM_ID}." >&2
            exit 1
          fi
          echo "CODE_SIGN_IDENTITY=${identity}" >> "${GITHUB_ENV}"
          # Updates installed by this build must be signed by the same team.
          echo "TUYO_SIGNER_APPLE_TEAM_ID=${APPLE_TEAM_ID}" >> "${GITHUB_ENV}"
          rm -f "${certificate}"

      - name: Build both architectures and merge them
        run: |
          set -euo pipefail
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "${target}"
          done
          mkdir dist
          lipo -create -output dist/tuyo-signer-universal-apple-darwin \
            target/aarch64-apple-darwin/release/tuyo-signer \
            target/x86_64-apple-darwin/release/tuyo-signer

      - name: Sign
        run: |
          set -euo pipefail
          binary=dist/tuyo-signer-universal-apple-darwin
          # The identifier is part of the keychain's trust in this binary: keep it stable.
          if [[ -n "${CODE_SIGN_IDENTITY:-}" ]]; then
            codesign --force --options runtime --timestamp \
              --identifier com.tuyo.signer --sign "${CODE_SIGN_IDENTITY}" "${binary}"
            codesign --verify --strict --verbose=2 \
              -R "anchor apple generic and identifier \"com.tuyo.signer\" and certificate leaf[subject.OU] = \"${APPLE_TEAM_ID}\"" \
              "${binary}"
          else
            echo "::warning::No Apple signing certificate; the macOS build is ad-hoc signed and not notarized."
            codesign --force --identifier com.tuyo.signer --sign - "${binary}"
          fi
          "${binary}" --version
          lipo -archs "${binary}"

      - name: Notarize
        if: env.HAS_CERTIFICATE == 'true'
        env:
          APPLE_NOTARY_APP_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLE_NOTARY_APPLE_ID:?Set the APPLE_NOTARY_APPLE_ID variable}"
          : "${APPLE_NOTARY_APP_PASSWORD:?Set the APPLE_NOTARY_APP_PASSWORD secret}"
          # A bare binary can't be stapled; Gatekeeper looks the ticket up online.
          ditto -c -k dist/tuyo-signer-universal-apple-darwin "${RUNNER_TEMP}/notarize.zip"
          result="$(xcrun notarytool submit "${RUNNER_TEMP}/notarize.zip" \
            --apple-id "${APPLE_NOTARY_APPLE_ID}" --password "${APPLE_NOTARY_APP_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" --wait --timeout 30m --output-format json)" || true
          echo "${result}"
          status="$(printf '%s' "${result}" | plutil -extract status raw -o - - 2>/dev/null || true)"
          if [[ "${status}" != "Accepted" ]]; then
            id="$(printf '%s' "${result}" | plutil -extract id raw -o - - 2>/dev/null || true)"
            [[ -n "${id}" ]] && xcrun notarytool log "${id}" --apple-id "${APPLE_NOTARY_APPLE_ID}" \
              --password "${APPLE_NOTARY_APP_PASSWORD}" --team-id "${APPLE_TEAM_ID}" || true
            echo "Notarization failed with status ${status:-unknown}." >&2
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/tuyo-signer-universal-apple-darwin
          archive: false
          if-no-files-found: error

      - name: Remove Apple credentials
        if: always()
        run: security delete-keychain "${RUNNER_TEMP}/signing.keychain-db" 2>/dev/null || true

  publish:
    name: Publish GitHub Release
    needs: [verify, linux, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tuyo-signer-*
          path: dist
          skip-decompress: true
          merge-multiple: true

      - name: Write checksums and update manifest
        run: |
          set -euo pipefail
          python3 scripts/release_manifest.py dist --repo "${GITHUB_REPOSITORY}" --tag "${GITHUB_REF_NAME}" \
            ${{ vars.MINIMUM_VERSION != '' && format('--minimum-version {0}', vars.MINIMUM_VERSION) || '' }}
          cp install.sh dist/install.sh
          cat dist/SHA256SUMS

      - name: Sign update manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${UPDATE_SIGNING_KEY}" ]]; then
            if [[ -n "${TUYO_SIGNER_UPDATE_PUBLIC_KEY}" ]]; then
              echo "UPDATE_PUBLIC_KEY is set but the UPDATE_SIGNING_KEY secret is missing." >&2
              exit 1
            fi
            echo "::warning::No UPDATE_SIGNING_KEY; this release can't be installed by self-update."
            exit 0
          fi
          key="${RUNNER_TEMP}/update-key.pem"
          umask 077
          printf '%s\n' "${UPDATE_SIGNING_KEY}" > "${key}"
          derived="$(openssl pkey -in "${key}" -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d " \n")"
          if [[ "${derived}" != "${TUYO_SIGNER_UPDATE_PUBLIC_KEY}" ]]; then
            echo "UPDATE_SIGNING_KEY does not match the UPDATE_PUBLIC_KEY variable." >&2
            exit 1
          fi
          openssl pkeyutl -sign -inkey "${key}" -rawin -in dist/manifest.json -out dist/manifest.json.sig
          openssl pkeyutl -verify -pubin -inkey <(openssl pkey -in "${key}" -pubout) \
            -rawin -in dist/manifest.json -sigfile dist/manifest.json.sig
          rm -f "${key}"

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/tuyo-signer-*

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=(--verify-tag --generate-notes --title "${GITHUB_REF_NAME}")
          [[ "${{ needs.verify.outputs.prerelease }}" == "true" ]] && flags+=(--prerelease)
          gh release create "${GITHUB_REF_NAME}" dist/* "${flags[@]}"

  npm:
    name: Publish to npm
    needs: [verify, publish]
    if: needs.verify.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: npm
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tuyo-signer-*
          path: dist
          skip-decompress: true
          merge-multiple: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Build and publish packages
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN}" ]]; then
            echo "::warning::No NPM_TOKEN; skipping npm publish."
            exit 0
          fi
          python3 scripts/npm_packages.py dist npm-out --version "${{ needs.verify.outputs.version }}"
          # Platform packages first, so the launcher never points at a missing one.
          for package in npm-out/signer-*; do
            npm publish "${package}" --access public --provenance
          done
          npm publish npm-out/signer --access public --provenance
