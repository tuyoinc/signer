name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo test
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked 2>&1 | tee "${RUNNER_TEMP}/test.log"
      - name: Report test failures
        if: failure()
        shell: bash
        run: grep -E "panicked|FAILED|left:|right:" "${RUNNER_TEMP}/test.log" | head -20 | sed 's/^/::error::/' || true

  musl:
    name: Static Linux build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Run in a minimal Alpine container
        run: |
          docker run --rm -v "$PWD/target/x86_64-unknown-linux-musl/release:/b:ro" alpine:3 \
            sh -c '/b/tuyo-signer --version && /b/tuyo-signer create agent && /b/tuyo-signer list'
