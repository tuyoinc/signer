[package]
name = "tuyo-signer"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Offline local signer for Tuyo agents: keeps a secp256k1 key in the OS keychain or an owner-only file and signs hashes over MCP or the command line."
license = "MIT OR Apache-2.0"
repository = "https://github.com/tuyoinc/signer"
publish = false

[dependencies]
base64 = "0.23"
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
hex = "0.4"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.4"
time = { version = "=0.3.44", default-features = false, features = ["std", "parsing", "formatting"] }
sha2 = "0.10"
sha3 = "0.10"
self-replace = "1.5"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "block2", "LAContext", "LAError"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
